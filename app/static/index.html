<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livres audio</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root { --bg: #0f1115; --card: #1a1e27; --text: #e8eaf0; --muted: #9aa3b2; --accent: #5b8cff; --danger: #e05d5d; --ok: #4caf7d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input[type=file], input[type=search], select, button { font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid #333a4a; background: #12151c; color: var(--text); }
  button { cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-small { font-size: 0.85rem; padding: 6px 10px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.extracting, .badge.converting, .badge.queued { background: #3a4a6b; color: #cfe0ff; }
  .badge.extracted { background: #6b5a2a; color: #ffe9a8; }
  .badge.done { background: #24503c; color: #a8f0cd; }
  .badge.error { background: #5a2a2a; color: #ffb3b3; }
  progress { width: 100%; height: 8px; margin-top: 8px; }
  audio { width: 100%; margin-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .warn { color: #ffcf7d; }
  a { color: var(--accent); }
  .book-head { display: flex; gap: 12px; align-items: flex-start; }
  .cover-box { flex: none; width: 60px; height: 90px; border-radius: 8px; background: #12151c; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; overflow: hidden; }
  .cover-box img { width: 100%; height: 100%; object-fit: cover; }
  .book-info { flex: 1; min-width: 0; }

  /* Reprendre l'écoute */
  #resume-hero { display: none; background: linear-gradient(135deg, #223055, #1a1e27); cursor: pointer; }
  #resume-hero .book-head { align-items: center; }
  #resume-hero .cover-box { width: 72px; height: 108px; }
  #resume-hero .play-big { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }

  /* Barre de progression du lecteur */
  .strip { margin-top: 10px; cursor: pointer; }
  .strip .track { position: relative; height: 14px; border-radius: 7px; background: #12151c; overflow: hidden; }
  .strip .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); opacity: 0.85; }
  .strip .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #4a5468; }
  .strip .times { display: flex; justify-content: space-between; margin-top: 4px; }
  .timer-note { color: #ffd166; font-size: 0.8rem; }

  details.chapters { margin-top: 8px; }
  details.chapters summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; padding: 4px 0; }
  .chapter-row { display: flex; gap: 10px; padding: 6px 6px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  .chapter-row:hover { background: #232a38; }
  .chapter-row.current { background: #24334f; color: #cfe0ff; }
  .chapter-time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 52px; }

  /* Bibliothèque : recherche, tri, grille */
  #library-bar { display: none; gap: 8px; margin-bottom: 12px; }
  #library-bar input[type=search] { flex: 1; min-width: 0; }
  #books { display: flex; flex-direction: column; }
  #books-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  .tile { cursor: pointer; text-align: center; }
  .tile .cover-box { width: 100%; height: auto; aspect-ratio: 2/3; margin-bottom: 4px; }
  .tile .t-title { font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card.flash { outline: 2px solid var(--accent); }

  /* Zone de dépôt */
  #upload-card.dragover { outline: 2px dashed var(--accent); outline-offset: -8px; }
  #upload-progress-box { display: none; }

  details.bench summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .bench-voice { border-top: 1px solid #262c3a; padding: 10px 0 4px; }
  .bench-voice .name { font-weight: 600; }
  .bench-voice .status { font-size: 0.8rem; color: var(--muted); }
  .bench-voice .status.error { color: var(--danger); }
  .bench-voice .default-mark { color: #ffd166; }
  .bench-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
</style>
</head>
<body>
<header><h1>📖 → 🎧 Livres audio</h1><div class="muted" id="engine-info"></div></header>
<main>
  <div class="card" id="resume-hero">
    <div class="book-head">
      <div class="cover-box" id="hero-cover">📖</div>
      <div class="book-info">
        <div class="muted">Continuer l'écoute</div>
        <div><strong id="hero-title"></strong></div>
        <div class="muted" id="hero-sub"></div>
      </div>
      <div class="play-big">▶</div>
    </div>
  </div>

  <div class="card" id="upload-card">
    <form id="upload-form">
      <input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple required>
      <select id="engine" title="Moteur de synthèse"></select>
      <select id="voice" title="Voix de lecture"></select>
      <select id="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
      <button type="submit" class="btn-primary">Ajouter (PDF ou EPUB — dépôt direct possible)</button>
      <div class="muted" id="engine-note"></div>
      <div id="upload-progress-box">
        <progress id="upload-progress" max="100" value="0"></progress>
        <div class="muted" id="upload-label"></div>
      </div>
    </form>
  </div>

  <div class="card">
    <details class="bench" id="bench">
      <summary>🎧 Banc d'essai des voix — écouter et choisir la voix par défaut</summary>
      <div class="bench-controls">
        <select id="bench-engine"></select>
        <select id="bench-language">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
        <button class="btn-primary btn-small" id="bench-generate">Générer les extraits</button>
      </div>
      <div class="muted" id="bench-sample"></div>
      <div id="bench-voices"></div>
    </details>
  </div>

  <div id="library-bar">
    <input type="search" id="search" placeholder="Rechercher un livre…">
    <select id="sort">
      <option value="recent">Récents</option>
      <option value="title">Titre A→Z</option>
      <option value="status">En cours d'abord</option>
    </select>
    <button class="btn-small" id="view-toggle" title="Basculer liste/grille">🔳</button>
  </div>
  <div id="books"></div>
  <div id="books-grid"></div>
</main>

<script>
const STATUS_LABELS = { extracting: "Extraction…", extracted: "Prêt", queued: "En attente", converting: "Conversion…", done: "Terminé", error: "Erreur" };
const READ_SPEED_CHARS_PER_SEC = 15.5; // débit moyen d'un livre audio en français
const cards = new Map(); // id -> élément DOM, pour ne pas recréer les lecteurs en cours d'écoute
const voiceNames = new Map(); // voice_id -> nom affichable
const progressSamples = new Map(); // id -> {t, done, rate} pour l'ETA de conversion
let latestBooks = [];
let CONFIG = { engines: [], monthly_quota_chars: 100000, default_engine: "", default_language: "fr" };

function engineByName(name) { return CONFIG.engines.find((e) => e.name === name); }

function mkBtn(label, onclick, cls = "btn-small") {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.onclick = onclick;
  return b;
}

function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function fmtDurationApprox(seconds) {
  if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + " min";
  const h = Math.floor(seconds / 3600), m = Math.round((seconds % 3600) / 60);
  return m ? `${h} h ${String(m).padStart(2, "0")}` : `${h} h`;
}

async function loadConfig() {
  CONFIG = await (await fetch("/api/config")).json();
  document.getElementById("language").value = CONFIG.default_language;

  for (const selectId of ["engine", "bench-engine"]) {
    const select = document.getElementById(selectId);
    select.innerHTML = "";
    for (const eng of CONFIG.engines) {
      const opt = document.createElement("option");
      opt.value = eng.name;
      opt.textContent = eng.label + (eng.available ? "" : " — indisponible");
      if (!eng.available) { opt.disabled = true; opt.title = eng.reason; }
      select.appendChild(opt);
    }
    const preferred = engineByName(CONFIG.default_engine);
    select.value = preferred && preferred.available
      ? CONFIG.default_engine
      : (CONFIG.engines.find((e) => e.available) || CONFIG.engines[0] || {}).name || "";
  }

  const active = CONFIG.engines.filter((e) => e.available).map((e) => e.label.split(" (")[0]);
  document.getElementById("engine-info").textContent =
    active.length ? "Moteurs : " + active.join(", ") : "Aucun moteur disponible — voir le README.";

  await loadVoices();
  document.getElementById("engine").addEventListener("change", loadVoices);
}

function updateEngineNote() {
  const engine = engineByName(document.getElementById("engine").value);
  const note = document.getElementById("engine-note");
  if (!engine) { note.textContent = ""; return; }
  if (!engine.available) { note.textContent = "⚠ " + engine.reason; return; }
  note.textContent = engine.name === "elevenlabs"
    ? "Moteur cloud payant : consomme le quota mensuel ElevenLabs."
    : "Moteur local : gratuit et illimité, généré sur le Mac.";
}

async function fetchVoiceOptions(engineName) {
  const { voices } = await (await fetch("/api/voices?engine=" + engineName)).json();
  for (const v of voices) voiceNames.set(v.voice_id, v.name);
  return voices;
}

function fillVoiceSelect(select, voices, preferredVoice) {
  select.innerHTML = "";
  if (voices.length) {
    for (const v of voices) {
      const opt = document.createElement("option");
      opt.value = v.voice_id;
      opt.textContent = v.name + (v.category === "cloned" ? " (clonée)" : "");
      select.appendChild(opt);
    }
    select.value = voices.some((v) => v.voice_id === preferredVoice) ? preferredVoice : voices[0].voice_id;
  } else {
    voiceNames.set(preferredVoice || "", "Voix par défaut");
    select.innerHTML = `<option value="${preferredVoice || ""}">Voix par défaut</option>`;
  }
}

async function loadVoices() {
  const engineName = document.getElementById("engine").value;
  const select = document.getElementById("voice");
  updateEngineNote();
  select.innerHTML = '<option value="">Chargement des voix…</option>';
  const voices = await fetchVoiceOptions(engineName);
  fillVoiceSelect(select, voices, (engineByName(engineName) || {}).default_voice || "");
}

// ------------------------------------------------------------ upload (drag & drop, multi, progression)

function uploadOne(file, onProgress) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/books");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      let detail = "";
      try { detail = JSON.parse(xhr.responseText).detail || ""; } catch (e) { /* réponse non JSON */ }
      resolve({ ok: xhr.status < 300, detail });
    };
    xhr.onerror = () => resolve({ ok: false, detail: "serveur injoignable" });
    const data = new FormData();
    data.append("file", file);
    data.append("language", document.getElementById("language").value);
    data.append("voice_id", document.getElementById("voice").value);
    data.append("engine", document.getElementById("engine").value);
    xhr.send(data);
  });
}

async function uploadFiles(fileList) {
  const files = [...fileList].filter((f) => /\.(pdf|epub)$/i.test(f.name));
  const skipped = fileList.length - files.length;
  if (!files.length) { alert("Aucun fichier PDF ou EPUB dans la sélection."); return; }
  const box = document.getElementById("upload-progress-box");
  const bar = document.getElementById("upload-progress");
  const label = document.getElementById("upload-label");
  box.style.display = "block";
  const errors = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const prefix = files.length > 1 ? `${i + 1}/${files.length} · ` : "";
    const result = await uploadOne(file, (frac) => {
      bar.value = Math.round(frac * 100);
      label.textContent = `${prefix}${file.name} · ${Math.round(frac * 100)} %`;
    });
    if (!result.ok) errors.push(`${file.name} : ${result.detail || "échec"}`);
    refresh();
  }
  box.style.display = "none";
  const notes = [];
  if (skipped) notes.push(`${skipped} fichier(s) ignoré(s) (ni PDF ni EPUB)`);
  if (errors.length) notes.push(errors.join("\n"));
  if (notes.length) alert(notes.join("\n"));
}

document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("file");
  if (!fileInput.files.length) return;
  const files = fileInput.files;
  fileInput.value = "";
  await uploadFiles(files);
});

const uploadCard = document.getElementById("upload-card");
["dragenter", "dragover"].forEach((evt) => uploadCard.addEventListener(evt, (e) => {
  e.preventDefault();
  uploadCard.classList.add("dragover");
}));
["dragleave", "drop"].forEach((evt) => uploadCard.addEventListener(evt, (e) => {
  e.preventDefault();
  uploadCard.classList.remove("dragover");
}));
uploadCard.addEventListener("drop", (e) => {
  if (e.dataTransfer?.files?.length) uploadFiles(e.dataTransfer.files);
});

// ------------------------------------------------------------ estimations

function bookEngine(book) { return book.engine || CONFIG.default_engine; }

function estimateLine(book) {
  const audioSec = book.char_count / READ_SPEED_CHARS_PER_SEC;
  let line = `≈ ${fmtDurationApprox(audioSec)} d'audio`;
  const cpm = (engineByName(bookEngine(book)) || {}).chars_per_min || 0;
  if (cpm > 0) line += ` · génération ≈ ${fmtDurationApprox(book.char_count / cpm * 60)}`;
  return line;
}

function conversionEta(book) {
  const now = Date.now();
  const prev = progressSamples.get(book.id);
  let entry = prev;
  if (!prev || book.done_chunks < prev.done) {
    entry = { t: now, done: book.done_chunks, rate: 0 };
  } else if (book.done_chunks > prev.done) {
    const rate = (book.done_chunks - prev.done) / ((now - prev.t) / 1000); // chunks/s
    entry = { t: now, done: book.done_chunks, rate: prev.rate ? prev.rate * 0.6 + rate * 0.4 : rate };
  }
  progressSamples.set(book.id, entry);
  if (!entry.rate || !book.total_chunks) return "";
  const remaining = (book.total_chunks - book.done_chunks) / entry.rate;
  return remaining > 5 ? ` · reste ≈ ${fmtDurationApprox(remaining)}` : "";
}

function formatChars(book) {
  const chars = book.char_count.toLocaleString("fr-FR") + " caractères";
  if (book.engine === "elevenlabs") {
    const pct = (book.char_count / CONFIG.monthly_quota_chars * 100).toFixed(0);
    return chars + " ≈ " + pct + " % du quota mensuel";
  }
  return chars + " (gratuit, local)";
}

function latestBookById(id) { return latestBooks.find((b) => b.id === id); }

function buildCancelBtn(book) {
  return mkBtn("✕ Annuler", async () => {
    const ok = confirm(
      "Arrêter la génération de « " + book.title + " » ?\n" +
      "Les segments déjà créés sont conservés : « Convertir » reprendra au même endroit."
    );
    if (!ok) return;
    const resp = await fetch(`/api/books/${book.id}/cancel`, { method: "POST" });
    if (!resp.ok) alert((await resp.json()).detail || "Échec de l'annulation");
    refresh();
  }, "btn-danger btn-small");
}

// Carte « conversion en cours » : construite une seule fois (la pré-écoute ne
// doit pas être coupée par le polling), puis seulement mise à jour.
function buildConvertingCard(body, book) {
  const bar = document.createElement("progress");
  bar.className = "conv-bar";
  const label = document.createElement("div");
  label.className = "muted conv-label";
  const row = document.createElement("div");
  row.className = "row";
  row.append(buildCancelBtn(book));

  const details = document.createElement("details");
  details.className = "chapters";
  const summary = document.createElement("summary");
  summary.textContent = "▶ Pré-écouter pendant la génération (voix réelle du livre)";
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  const status = document.createElement("div");
  status.className = "muted";
  details.append(summary, audio, status);

  const state = { idx: 0, waiting: false };
  const doneCount = () => (latestBookById(book.id) || book).done_chunks || 0;
  const startAt = (i) => {
    state.idx = i;
    state.waiting = false;
    audio.src = `/api/books/${book.id}/chunks/${i}`;
    audio.play().catch(() => {});
    status.textContent = `segment ${i} — ${doneCount()} déjà générés`;
    if (i + 1 <= doneCount()) new Audio(`/api/books/${book.id}/chunks/${i + 1}`); // préchargement
  };
  details.addEventListener("toggle", () => {
    if (details.open && state.idx === 0) {
      if (doneCount() >= 1) startAt(1);
      else { state.waiting = true; status.textContent = "aucun segment prêt pour l'instant…"; }
    }
  });
  audio.addEventListener("ended", () => {
    if (state.idx + 1 <= doneCount()) startAt(state.idx + 1);
    else { state.waiting = true; status.textContent = "segment suivant en cours de génération…"; }
  });
  // Appelé à chaque polling : reprend automatiquement quand le segment attendu arrive.
  body._liveTick = () => {
    if (state.waiting && state.idx + 1 <= doneCount() && details.open) startAt(state.idx + 1);
    else if (state.idx > 0 && !state.waiting) status.textContent = `segment ${state.idx} — ${doneCount()} déjà générés`;
  };

  body.append(bar, label, row, details);
  updateConvertingCard(body, book);
}

function updateConvertingCard(body, book) {
  const bar = body.querySelector(".conv-bar");
  if (bar) { bar.max = book.total_chunks || 1; bar.value = book.done_chunks; }
  const label = body.querySelector(".conv-label");
  if (label) label.textContent = `${book.done_chunks} / ${book.total_chunks} segments${conversionEta(book)}`;
  if (body._liveTick) body._liveTick();
}

function buildCard(book) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = book.id;
  card.innerHTML = `
    <div class="book-head">
      <div class="cover-box"></div>
      <div class="book-info">
        <div><strong></strong></div>
        <div class="row"><span class="badge"></span><span class="muted voice"></span><span class="muted chars"></span></div>
      </div>
    </div>
    <div class="body"></div>`;
  card.querySelector("strong").textContent = book.title;
  return card;
}

// ------------------------------------------------------------ lecteur enrichi

function buildPlayer(body, book) {
  const voiceLabel = book.voice_label || voiceNames.get(book.voice_id) || book.voice_id;
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "metadata";
  audio.src = `/api/books/${book.id}/audio`;
  body.dataset.hasPlayer = "1";

  // Position : le serveur fait foi (multi-appareils), localStorage en secours.
  const posKey = "pos_" + book.id;
  const startPos = book.position_seconds > 0
    ? book.position_seconds
    : (parseFloat(localStorage.getItem(posKey)) || 0);
  audio.addEventListener("loadedmetadata", () => {
    if (startPos > 0 && startPos < audio.duration - 10) audio.currentTime = startPos;
    buildTicks();
    updateStrip();
    renderHero();
  });
  let lastSync = 0;
  const syncPosition = (force) => {
    localStorage.setItem(posKey, audio.currentTime);
    if (!force && Date.now() - lastSync < 5000) return;
    lastSync = Date.now();
    fetch(`/api/books/${book.id}/position`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seconds: audio.currentTime }),
    }).catch(() => {});
  };

  const seekBy = (delta) => {
    const max = isFinite(audio.duration) ? audio.duration - 0.5 : Infinity;
    audio.currentTime = Math.max(0, Math.min(max, audio.currentTime + delta));
  };

  // Chapitres (depuis les métadonnées du M4B)
  let chapters = [];
  let chapterRows = [];
  const chapDetails = document.createElement("details");
  chapDetails.className = "chapters";
  const currentChapterIndex = () => {
    let idx = -1;
    for (let i = 0; i < chapters.length; i++) if (audio.currentTime >= chapters[i].start - 0.5) idx = i;
    return idx;
  };
  const updateChapterHighlight = () => {
    if (!chapterRows.length) return;
    const idx = currentChapterIndex();
    chapterRows.forEach((row, i) => row.classList.toggle("current", i === idx));
  };
  const jumpChapter = (dir) => {
    if (!chapters.length) return;
    const target = chapters[Math.max(0, Math.min(chapters.length - 1, currentChapterIndex() + dir))];
    if (target) audio.currentTime = target.start;
  };

  // Barre de progression avec graduations de chapitres
  const strip = document.createElement("div");
  strip.className = "strip";
  strip.innerHTML = `<div class="track"><div class="fill"></div></div>
    <div class="times muted"><span class="t-elapsed">0:00</span><span class="t-chapter"></span><span class="t-remaining"></span></div>`;
  const track = strip.querySelector(".track");
  const buildTicks = () => {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    track.querySelectorAll(".tick").forEach((t) => t.remove());
    for (const ch of chapters.slice(1)) {
      const tick = document.createElement("div");
      tick.className = "tick";
      tick.style.left = (ch.start / audio.duration * 100) + "%";
      track.appendChild(tick);
    }
  };
  const updateStrip = () => {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    strip.querySelector(".fill").style.width = (audio.currentTime / audio.duration * 100) + "%";
    strip.querySelector(".t-elapsed").textContent = fmtTime(audio.currentTime);
    strip.querySelector(".t-remaining").textContent = "reste " + fmtTime(audio.duration - audio.currentTime);
    const idx = currentChapterIndex();
    strip.querySelector(".t-chapter").textContent =
      chapters.length > 1 && idx >= 0 ? `ch. ${idx + 1}/${chapters.length}` : "";
  };
  track.addEventListener("click", (e) => {
    if (!isFinite(audio.duration)) return;
    const rect = track.getBoundingClientRect();
    audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
  });

  fetch(`/api/books/${book.id}/chapters`).then((r) => r.json()).then((data) => {
    chapters = data.chapters || [];
    buildTicks();
    if (chapters.length < 2) return;
    const summary = document.createElement("summary");
    summary.textContent = `Chapitres (${chapters.length})`;
    chapDetails.appendChild(summary);
    chapterRows = chapters.map((ch) => {
      const row = document.createElement("div");
      row.className = "chapter-row";
      const time = document.createElement("span");
      time.className = "chapter-time";
      time.textContent = fmtTime(ch.start);
      const label = document.createElement("span");
      label.textContent = ch.title || "Chapitre";
      row.append(time, label);
      row.onclick = () => { audio.currentTime = ch.start; audio.play(); };
      chapDetails.appendChild(row);
      return row;
    });
  }).catch(() => {});

  // Minuterie de sommeil
  let sleepDeadline = null;      // timestamp ms
  let sleepChapterStart = null;  // index de chapitre au moment de l'activation
  const timerNote = document.createElement("span");
  timerNote.className = "timer-note";
  const sleepSelect = document.createElement("select");
  sleepSelect.className = "btn-small";
  sleepSelect.title = "Minuterie de sommeil";
  for (const [value, label] of [["off", "🌙 off"], ["15", "🌙 15 min"], ["30", "🌙 30 min"], ["45", "🌙 45 min"], ["60", "🌙 60 min"], ["chapter", "🌙 fin du chapitre"]]) {
    const opt = document.createElement("option");
    opt.value = value; opt.textContent = label;
    sleepSelect.appendChild(opt);
  }
  const resetSleep = () => {
    sleepDeadline = null; sleepChapterStart = null;
    sleepSelect.value = "off"; timerNote.textContent = "";
  };
  sleepSelect.onchange = () => {
    if (sleepSelect.value === "off") { resetSleep(); return; }
    if (sleepSelect.value === "chapter") {
      sleepDeadline = null;
      sleepChapterStart = currentChapterIndex();
      timerNote.textContent = "jusqu'à la fin du chapitre";
    } else {
      sleepChapterStart = null;
      sleepDeadline = Date.now() + parseInt(sleepSelect.value, 10) * 60000;
    }
  };
  const checkSleep = () => {
    if (sleepDeadline !== null) {
      const left = sleepDeadline - Date.now();
      if (left <= 0) { audio.pause(); resetSleep(); return; }
      timerNote.textContent = fmtDurationApprox(left / 1000);
    } else if (sleepChapterStart !== null && currentChapterIndex() > sleepChapterStart) {
      audio.pause();
      resetSleep();
    }
  };

  // Écran verrouillé / commandes système (Android & iOS)
  const setupMediaSession = () => {
    if (!("mediaSession" in navigator)) return;
    const artwork = book.has_cover
      ? [{ src: `/api/books/${book.id}/cover`, sizes: "600x900", type: "image/jpeg" }]
      : [{ src: "/icons/icon-512.png", sizes: "512x512", type: "image/png" }];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: book.title, artist: voiceLabel || "Livres audio", album: "Livres audio", artwork,
    });
    const on = (action, handler) => {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) { /* non supporté */ }
    };
    on("play", () => audio.play());
    on("pause", () => audio.pause());
    on("seekbackward", (d) => seekBy(-(d.seekOffset || 30)));
    on("seekforward", (d) => seekBy(d.seekOffset || 30));
    on("seekto", (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
    on("previoustrack", () => jumpChapter(-1));
    on("nexttrack", () => jumpChapter(1));
  };
  const updatePositionState = () => {
    if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: Math.min(audio.currentTime, audio.duration),
      });
    } catch (e) { /* valeurs transitoires invalides */ }
  };

  audio.addEventListener("play", () => {
    document.querySelectorAll("audio").forEach((a) => { if (a !== audio) a.pause(); });
    setupMediaSession();
  });
  audio.addEventListener("timeupdate", () => {
    if (!audio.paused) syncPosition(false);
    updateChapterHighlight();
    updateStrip();
    updatePositionState();
    checkSleep();
  });
  audio.addEventListener("pause", () => syncPosition(true));
  audio.addEventListener("ended", () => { localStorage.removeItem(posKey); syncPosition(true); resetSleep(); });

  const row = document.createElement("div");
  row.className = "row";
  const speed = document.createElement("select");
  speed.className = "btn-small";
  for (const v of [0.75, 1, 1.25, 1.5, 2]) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = "×" + v;
    if (v === 1) opt.selected = true;
    speed.appendChild(opt);
  }
  speed.onchange = () => audio.playbackRate = parseFloat(speed.value);
  const dl = document.createElement("a");
  dl.href = audio.src; dl.download = book.title + ".mp3"; dl.textContent = "MP3";
  row.append(mkBtn("⏪ 30 s", () => seekBy(-30)), mkBtn("30 s ⏩", () => seekBy(30)), speed, sleepSelect, timerNote, dl);
  if (book.has_m4b) {
    const m4b = document.createElement("a");
    m4b.href = `/api/books/${book.id}/audio.m4b`;
    m4b.textContent = "M4B";
    m4b.title = "Livre audio chapitré avec pochette (app Livres)";
    row.append(m4b);
  }
  body.append(audio, strip, row, chapDetails);
}

// ------------------------------------------------------------ reconversion

function buildReconvertPanel(body, book) {
  const holder = document.createElement("div");
  const trigger = mkBtn("🔁 Autre voix", async () => {
    trigger.style.display = "none";
    const panel = document.createElement("div");
    panel.className = "row";
    const engineSel = document.createElement("select");
    engineSel.className = "btn-small";
    for (const eng of CONFIG.engines.filter((e) => e.available)) {
      const opt = document.createElement("option");
      opt.value = eng.name;
      opt.textContent = eng.label.split(" (")[0];
      engineSel.appendChild(opt);
    }
    if ([...engineSel.options].some((o) => o.value === bookEngine(book))) engineSel.value = bookEngine(book);
    const voiceSel = document.createElement("select");
    voiceSel.className = "btn-small";
    const loadPanelVoices = async () => {
      voiceSel.innerHTML = "<option>…</option>";
      const voices = await fetchVoiceOptions(engineSel.value);
      const preferred = engineSel.value === bookEngine(book) && book.voice_id
        ? book.voice_id
        : (engineByName(engineSel.value) || {}).default_voice || "";
      fillVoiceSelect(voiceSel, voices, preferred);
    };
    engineSel.onchange = loadPanelVoices;
    await loadPanelVoices();
    const go = mkBtn("Lancer", async () => {
      go.disabled = true;
      const resp = await fetch(`/api/books/${book.id}/reconvert`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ engine: engineSel.value, voice_id: voiceSel.value }),
      });
      if (!resp.ok) { alert((await resp.json()).detail || "Échec"); go.disabled = false; return; }
      refresh();
    }, "btn-primary btn-small");
    const cancel = mkBtn("Annuler", () => { panel.remove(); trigger.style.display = ""; });
    panel.append(engineSel, voiceSel, go, cancel);
    holder.appendChild(panel);
  });
  holder.appendChild(trigger);
  body.appendChild(holder);
}

function updateCard(book) {
  let card = cards.get(book.id);
  if (!card) { card = buildCard(book); cards.set(book.id, card); document.getElementById("books").prepend(card); }

  const badge = card.querySelector(".badge");
  badge.className = "badge " + book.status;
  badge.textContent = STATUS_LABELS[book.status] || book.status;

  const voiceLabel = book.voice_label || voiceNames.get(book.voice_id) || book.voice_id;
  card.querySelector(".voice").textContent = voiceLabel ? "🎙 " + voiceLabel : "";
  card.querySelector(".chars").textContent = book.char_count ? formatChars(book) : "";

  const coverBox = card.querySelector(".cover-box");
  if (book.has_cover) {
    if (!coverBox.querySelector("img")) {
      coverBox.textContent = "";
      const img = document.createElement("img");
      img.src = `/api/books/${book.id}/cover`;
      img.alt = "";
      coverBox.appendChild(img);
    }
  } else if (!coverBox.textContent) {
    coverBox.textContent = "📖";
  }

  const body = card.querySelector(".body");
  // Ne jamais reconstruire le lecteur d'un livre terminé pendant l'écoute,
  // ni la pré-écoute d'une conversion en cours.
  if (book.status === "done" && body.dataset.ready === "1") return;
  if (book.status === "converting" && body.dataset.mode === "converting") {
    updateConvertingCard(body, book);
    return;
  }
  body.innerHTML = "";
  delete body.dataset.ready;
  delete body.dataset.mode;

  const makeConvertBtn = (label) => {
    const btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.textContent = label;
    btn.onclick = async () => {
      btn.disabled = true;
      const resp = await fetch(`/api/books/${book.id}/convert`, { method: "POST" });
      if (!resp.ok) { alert((await resp.json()).detail); btn.disabled = false; }
      refresh();
    };
    return btn;
  };

  if (book.status === "extracted") {
    const note = document.createElement("div");
    note.className = "muted";
    note.textContent = estimateLine(book);
    body.append(note, makeConvertBtn("Convertir en audio"));
  } else if (book.status === "queued") {
    const note = document.createElement("div");
    note.className = "muted";
    note.textContent = "Dans la file d'attente — la synthèse démarre dès que le Mac est libre.";
    const row = document.createElement("div");
    row.className = "row";
    row.append(buildCancelBtn(book));
    body.append(note, row);
  } else if (book.status === "converting") {
    body.dataset.mode = "converting";
    buildConvertingCard(body, book);
  } else if (book.status === "done") {
    body.dataset.ready = "1";
    buildPlayer(body, book);
    buildReconvertPanel(body.querySelector(".row"), book);
  } else if (book.status === "error") {
    const msg = document.createElement("div");
    msg.className = "warn";
    msg.textContent = book.error || "Erreur inconnue.";
    body.appendChild(msg);
    // Reprise possible si le texte a été extrait (les segments déjà générés
    // ne sont pas re-générés)
    if (book.char_count > 0) {
      body.appendChild(makeConvertBtn("Réessayer la conversion"));
      buildReconvertPanel(body, book);
    }
  }

  // Bouton supprimer toujours disponible (sauf pendant conversion)
  if (book.status !== "converting" && book.status !== "queued") {
    const row = body.querySelector(".row") || (() => { const r = document.createElement("div"); r.className = "row"; body.appendChild(r); return r; })();
    if (!row.querySelector(".btn-danger")) {
      const del = document.createElement("button");
      del.className = "btn-danger btn-small";
      del.textContent = "Supprimer";
      del.onclick = async () => {
        if (!confirm("Supprimer « " + book.title + " » ?")) return;
        await fetch(`/api/books/${book.id}`, { method: "DELETE" });
        cards.get(book.id)?.remove();
        cards.delete(book.id);
        refresh();
      };
      row.appendChild(del);
    }
  }
}

// ------------------------------------------------------------ bibliothèque (recherche, tri, grille)

let viewMode = localStorage.getItem("view") || "list";
const STATUS_ORDER = { converting: 0, queued: 1, extracting: 2, extracted: 3, error: 4, done: 5 };

function sortedFilteredBooks() {
  const q = (document.getElementById("search").value || "").toLowerCase();
  let list = latestBooks.filter((b) => !q || b.title.toLowerCase().includes(q));
  const mode = document.getElementById("sort").value;
  if (mode === "title") list = [...list].sort((a, b) => a.title.localeCompare(b.title, "fr"));
  else if (mode === "status") list = [...list].sort((a, b) => (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9));
  return list; // "recent" : ordre serveur (created_at desc)
}

function renderLibrary() {
  const bar = document.getElementById("library-bar");
  bar.style.display = latestBooks.length >= 5 ? "flex" : "none";
  if (latestBooks.length < 5) { document.getElementById("search").value = ""; viewMode = "list"; }

  const list = sortedFilteredBooks();
  const booksEl = document.getElementById("books");
  const gridEl = document.getElementById("books-grid");
  document.getElementById("view-toggle").textContent = viewMode === "list" ? "🔳" : "📋";

  // Tri/filtre par CSS order + display : aucun déplacement DOM,
  // la lecture audio en cours n'est jamais interrompue.
  const orderOf = new Map(list.map((b, i) => [b.id, i]));
  for (const [id, card] of cards) {
    const order = orderOf.get(id);
    card.style.display = (order === undefined || viewMode === "grid") ? "none" : "";
    if (order !== undefined) card.style.order = order;
  }

  gridEl.style.display = viewMode === "grid" ? "grid" : "none";
  if (viewMode === "grid") {
    gridEl.innerHTML = "";
    for (const book of list) {
      const tile = document.createElement("div");
      tile.className = "tile";
      const cover = document.createElement("div");
      cover.className = "cover-box";
      if (book.has_cover) {
        const img = document.createElement("img");
        img.src = `/api/books/${book.id}/cover`;
        cover.appendChild(img);
      } else cover.textContent = "📖";
      const title = document.createElement("div");
      title.className = "t-title";
      title.textContent = book.title;
      const badge = document.createElement("span");
      badge.className = "badge " + book.status;
      badge.textContent = STATUS_LABELS[book.status] || book.status;
      tile.append(cover, title, badge);
      tile.onclick = () => {
        viewMode = "list";
        localStorage.setItem("view", viewMode);
        renderLibrary();
        const card = cards.get(book.id);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.classList.add("flash");
          setTimeout(() => card.classList.remove("flash"), 1500);
        }
      };
      gridEl.appendChild(tile);
    }
  }
}

document.getElementById("view-toggle").addEventListener("click", () => {
  viewMode = viewMode === "list" ? "grid" : "list";
  localStorage.setItem("view", viewMode);
  renderLibrary();
});
document.getElementById("search").addEventListener("input", renderLibrary);
document.getElementById("sort").addEventListener("change", () => {
  localStorage.setItem("sort", document.getElementById("sort").value);
  renderLibrary();
});
document.getElementById("sort").value = localStorage.getItem("sort") || "recent";

// ------------------------------------------------------------ reprendre l'écoute

function renderHero() {
  const hero = document.getElementById("resume-hero");
  const candidates = latestBooks
    .filter((b) => b.status === "done" && b.last_played_at && b.position_seconds > 5)
    .sort((a, b) => b.last_played_at.localeCompare(a.last_played_at));
  const book = candidates[0];
  if (!book) { hero.style.display = "none"; return; }

  const cover = document.getElementById("hero-cover");
  if (book.has_cover) {
    if (!cover.querySelector("img") || cover.dataset.id !== book.id) {
      cover.textContent = "";
      cover.innerHTML = `<img src="/api/books/${book.id}/cover" alt="">`;
    }
  } else { cover.innerHTML = ""; cover.textContent = "📖"; }
  cover.dataset.id = book.id;
  document.getElementById("hero-title").textContent = book.title;

  const cardAudio = cards.get(book.id)?.querySelector("audio");
  let sub = "repris à " + fmtTime(book.position_seconds);
  if (cardAudio && isFinite(cardAudio.duration) && cardAudio.duration > 0) {
    sub += ` · reste ${fmtDurationApprox(cardAudio.duration - book.position_seconds)}`;
  }
  document.getElementById("hero-sub").textContent = sub;

  hero.style.display = "block";
  hero.onclick = () => {
    const card = cards.get(book.id);
    const audio = card?.querySelector("audio");
    if (!audio) return;
    audio.play();
    card.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

// ------------------------------------------------------------ banc d'essai

const bench = document.getElementById("bench");
const benchPlayers = new Map(); // voice_id -> élément, pour ne pas couper l'écoute

function benchSelection() {
  return {
    engine: document.getElementById("bench-engine").value,
    language: document.getElementById("bench-language").value,
  };
}

async function refreshBench() {
  if (!bench.open) return;
  const { engine, language } = benchSelection();
  if (!engine) return;
  const resp = await fetch(`/api/previews?engine=${engine}&language=${language}`);
  if (!resp.ok) return;
  const data = await resp.json();
  document.getElementById("bench-sample").textContent = "Extrait lu : « " + data.sample_text + " »";
  const container = document.getElementById("bench-voices");
  const engineCfg = engineByName(engine) || {};

  for (const v of data.voices) {
    const key = engine + "|" + language + "|" + v.voice_id;
    let rowEl = benchPlayers.get(key);
    if (!rowEl) {
      rowEl = document.createElement("div");
      rowEl.className = "bench-voice";
      rowEl.dataset.key = key;
      rowEl.innerHTML = `<div><span class="name"></span> <span class="default-mark"></span></div>
        <div class="status"></div><div class="player"></div><div class="actions row"></div>`;
      rowEl.querySelector(".name").textContent = v.name;
      benchPlayers.set(key, rowEl);
    }
    if (!rowEl.isConnected) container.appendChild(rowEl);

    rowEl.querySelector(".default-mark").textContent =
      engineCfg.default_voice === v.voice_id && CONFIG.default_engine === engine ? "⭐ voix par défaut" : "";

    const statusEl = rowEl.querySelector(".status");
    statusEl.className = "status" + (v.status === "error" ? " error" : "");
    statusEl.textContent = {
      missing: "extrait non généré",
      pending: "génération en cours…",
      error: "erreur : " + v.error,
      ready: "",
    }[v.status];

    const player = rowEl.querySelector(".player");
    if (v.status === "ready" && !player.querySelector("audio")) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.src = `/api/previews/audio?engine=${engine}&voice_id=${encodeURIComponent(v.voice_id)}&language=${language}`;
      player.appendChild(audio);
    }

    const actions = rowEl.querySelector(".actions");
    if (v.status === "ready" && !actions.querySelector("button")) {
      const setDefault = document.createElement("button");
      setDefault.className = "btn-primary btn-small";
      setDefault.textContent = "⭐ Définir comme voix par défaut";
      setDefault.onclick = async () => {
        const resp = await fetch("/api/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ engine, voice_id: v.voice_id }),
        });
        if (resp.ok) { CONFIG = await resp.json(); await loadVoices(); refreshBench(); }
      };
      actions.appendChild(setDefault);
    }
  }

  // Retirer les lignes des voix qui n'existent plus dans la sélection courante.
  for (const child of [...container.children]) {
    if (!data.voices.some((v) => child.dataset.key === engine + "|" + language + "|" + v.voice_id)) {
      child.remove();
    }
  }
}

document.getElementById("bench-generate").addEventListener("click", async () => {
  const { engine, language } = benchSelection();
  const resp = await fetch("/api/previews", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ engine, language, all: true }),
  });
  if (!resp.ok) { alert((await resp.json()).detail || "Échec"); return; }
  refreshBench();
});

for (const id of ["bench-engine", "bench-language"]) {
  document.getElementById(id).addEventListener("change", () => {
    document.getElementById("bench-voices").innerHTML = "";
    refreshBench();
  });
}
bench.addEventListener("toggle", refreshBench);

// ------------------------------------------------------------ rafraîchissement

async function refresh() {
  try {
    const books = await (await fetch("/api/books")).json();
    latestBooks = books;
    const seen = new Set();
    for (const book of books) { seen.add(book.id); updateCard(book); }
    for (const [id, card] of cards) if (!seen.has(id)) { card.remove(); cards.delete(id); }
    renderLibrary();
    renderHero();
  } catch (e) { /* serveur injoignable : on réessaiera au prochain tick */ }
  try { await refreshBench(); } catch (e) { /* idem */ }
}

loadConfig().then(refresh);
setInterval(refresh, 3000);
